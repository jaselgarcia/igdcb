---

layout: default

---

{% if page.path contains "en/" %}
    {% assign date-format = "%m.%d.%Y" %}
{% else %}
    {% assign date-format = "%d.%m.%Y" %}
{% endif %}

<article class="blog-post">
    <header> 
        <h1>{{ page.title }}</h1>
        <time datetime="{{ page.date }}">{{ page.date | date: date-format }}</time>
    </header>

    <img alt="{{ page.featured_image_alt_text }}" src="{{ page.featured_image | prepend: site.baseurl }}" />

{{ content }}
</article>
